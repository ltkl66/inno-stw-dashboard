<title>INNO 提货趋势看板</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#eef1f6;color:#12263f;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:392px}
.card{background:#fff;border-radius:14px;padding:34px 30px 22px;text-align:center;
  box-shadow:0 18px 44px rgba(18,38,63,.14);border-top:3px solid #c08420}
.ic{width:36px;height:36px;display:block;margin:0 auto 12px}
.kicker{font-size:11px;letter-spacing:2.4px;color:#8b96a6}
h1{font-size:19px;margin:8px 0 6px;letter-spacing:.4px}
.sub{font-size:12.5px;color:#6b7a8d;margin:0 0 20px}
form{display:flex;gap:8px}
input[type=password]{flex:1;min-width:0;height:40px;border:1px solid #d5dce6;border-radius:8px;
  padding:0 12px;font-size:14px;color:#12263f;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=password]:focus{border-color:#c08420;box-shadow:0 0 0 3px rgba(192,132,32,.14)}
button{height:40px;padding:0 18px;border:0;border-radius:8px;background:#12263f;color:#fff;
  font-size:13.5px;letter-spacing:1px;cursor:pointer;transition:background .15s}
button:hover:not(:disabled){background:#1c3a5c}
button:disabled{opacity:.6;cursor:default}
.rm{display:flex;align-items:center;gap:6px;margin:11px 0 0;font-size:11.5px;color:#8b96a6;cursor:pointer}
.rm input{margin:0;accent-color:#c08420}
.err{margin-top:10px;font-size:12px;color:#c0392b;background:#fdf1f0;border:1px solid #f3d3cf;
  border-radius:7px;padding:7px 10px}
.note{margin-top:20px;padding-top:13px;border-top:1px solid #eceff4;font-size:11px;color:#9aa5b4;line-height:1.6}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#c08420" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="10.5" width="17" height="10.5" rx="2.2"/><path d="M7.5 10.5V7.2a4.5 4.5 0 0 1 9 0v3.3"/><circle cx="12" cy="15.6" r="1.25" fill="#c08420" stroke="none"/><path d="M12 16.6v1.9"/></svg>

    <h1>INNO 提货趋势看板</h1>
    <p class="sub">内部数据，请输入访问密码</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="访问密码" autocomplete="current-password" autofocus>
      <button id="go" type="submit">解 锁</button>

    <label class="rm"><input type="checkbox" id="rm"> 在本机记住密码</label>
    <div id="err" class="err" hidden></div>

  </section>
</main>

<script>
(function(){
  var PAYLOAD = JSON.parse(document.getElementById("enc").textContent);
  var KEY = "inno_dash_pw";
  var f = document.getElementById("f"), pw = document.getElementById("pw"),
      err = document.getElementById("err"), rm = document.getElementById("rm"),
      go = document.getElementById("go");
  function b64(s){
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function dropSaved(){ try { localStorage.removeItem(KEY); } catch (e) {} }
  function fail(msg){
    err.textContent = msg; err.hidden = false;
    pw.value = ""; pw.focus();
    go.disabled = false; go.textContent = "解 锁";
  }
  function unlock(p){
    go.disabled = true; go.textContent = "解密中…"; err.hidden = true;
    if (!(window.crypto && window.crypto.subtle)) {
      fail("当前环境不支持解密，请用 Chrome / Edge 打开"); return;
    }
    var km = crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
    km.then(function(k){
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
        k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function(k){
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, k, b64(PAYLOAD.ct));
    }).then(function(buf){
      var html = new TextDecoder("utf-8").decode(buf);
      if (rm.checked) { try { localStorage.setItem(KEY, p); } catch (e) {} }
      else { dropSaved(); }
      document.open(); document.write(html); document.close();
    }).catch(function(){
      dropSaved();
      fail("密码不正确，请重试");
    });
  }
  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    if (pw.value) unlock(pw.value);
  });
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) { rm.checked = true; unlock(saved); }
  } catch (e) {}
})();
</script>
